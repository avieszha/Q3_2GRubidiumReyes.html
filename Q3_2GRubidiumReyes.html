<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club / Organization Application</title>

<style>
  body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#eef2ff,#fdf2f8);
    padding:30px;
  }

  form{
    max-width:720px;
    margin:auto;
    background:#ffffff;
    padding:22px;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(76,87,255,0.12);
    border-top:6px solid #6366f1;
  }

  h2{
    text-align:center;
    margin-bottom:12px;
    color:#3730a3;
  }

  fieldset{
    border:1px solid #e5e7eb;
    margin-bottom:16px;
    padding:16px;
    border-radius:8px;
    background:#fafafa;
  }

  legend{
    font-weight:bold;
    padding:0 8px;
    color:#4338ca;
  }

  label{
    display:block;
    margin:12px 0;
    color:#374151;
  }

  input, select, textarea{
    width:100%;
    padding:9px;
    border:1.5px solid #c7c9ff;
    border-radius:6px;
    box-sizing:border-box;
    background:#ffffff;
  }

  input::placeholder,
  textarea::placeholder{
    color:#9ca3af;
  }

  input:focus, select:focus, textarea:focus{
    outline:none;
    border-color:#6366f1;
    box-shadow:0 0 0 2px rgba(99,102,241,0.2);
  }

  textarea{resize:vertical}

  .inline{
    display:inline-block;
    margin-right:18px;
    width:auto;
    color:#1f2937;
  }

  .missing{
    border:2px solid #dc2626;
    background:#fff1f2;
  }

  .error-box{
    display:none;
    background:#fee2e2;
    color:#7f1d1d;
    padding:12px;
    border-radius:8px;
    margin-bottom:16px;
    font-size:0.95em;
    border-left:5px solid #dc2626;
  }

  .success-box{
    display:none;
    background:#dcfce7;
    color:#14532d;
    padding:12px;
    border-radius:8px;
    margin-bottom:16px;
    font-size:0.95em;
    border-left:5px solid #22c55e;
  }

  .actions{
    text-align:right;
    margin-top:18px;
    display:flex;
    justify-content:flex-end;
    gap:8px;
    flex-wrap:wrap;
  }

  button{
    padding:9px 16px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
  }

  button[type="submit"]{
    background:linear-gradient(135deg,#6366f1,#4f46e5);
    color:white;
  }

  button[type="submit"]:hover{
    background:linear-gradient(135deg,#4f46e5,#4338ca);
  }

  button[type="reset"]{
    background:#e5e7eb;
    color:#374151;
  }

  button[type="reset"]:hover{
    background:#d1d5db;
  }

  /* ✅ New View button style */
  #viewBtn{
    background:#111827;
    color:#fff;
  }
  #viewBtn:hover{
    background:#0b1220;
  }
</style>
</head>

<body>

<!-- ✅ action attribute removed -->
<form id="appForm" method="post">
  <h2>Club / Organization Application</h2>

  <div class="error-box" id="errorBox">
    Please fill out all required fields highlighted in red.
  </div>

  <div class="success-box" id="successBox">
    Saved successfully!
  </div>

  <fieldset>
    <legend>Information 1–4</legend>

    <label>Student ID
      <input type="number" name="studentId" required placeholder="e.g. 202501234">
    </label>

    <label>Full Name
      <input type="text" name="fullName" required placeholder="e.g. Juan Dela Cruz">
    </label>

    <label>Birthday
      <input type="date" name="birthday" required>
    </label>

    <label>Email Address
      <input type="email" name="email" required placeholder="e.g. juan@email.com">
    </label>
  </fieldset>

  <fieldset>
    <legend>Information 5–8</legend>

    <label>Mobile Phone
      <input type="text" name="mobile" required placeholder="e.g. 0917XXXXXXX">
    </label>

    <label>Grade Level
      <select name="gradeLevel" required>
        <option value="">— Select Grade Level —</option>
        <option value="G07">Grade 7</option>
        <option value="G08">Grade 8</option>
        <option value="G09">Grade 9</option>
        <option value="G10">Grade 10</option>
        <option value="G11">Grade 11</option>
        <option value="G12">Grade 12</option>
      </select>
    </label>

    <label>Intern / Extern</label>
    <label class="inline"><input type="radio" name="roleType" value="INT" required> Intern</label>
    <label class="inline"><input type="radio" name="roleType" value="EXT" required> Extern</label>

    <label>Preferred Organization / Club
      <select name="club" required>
        <option value="">— Select a Club —</option>
        <option value="CLB_STEM">STEM Society</option>
        <option value="CLB_ARTS">Arts Guild</option>
        <option value="CLB_DEB">Debate Club</option>
        <option value="CLB_VOL">Volunteer Corps</option>
        <option value="CLB_CODE">Coding Circle</option>
      </select>
    </label>
  </fieldset>

  <label>Why do you want to join
    <textarea name="reason" required
      placeholder="e.g. I want to join because I want to develop my skills and contribute to the organization."></textarea>
  </label>

  <div class="actions">
    <button type="submit">Submit</button>

    <button type="button" id="viewBtn">View Signups</button>

    <button type="reset">Reset</button>
  </div>
</form>

<script>
const form = document.getElementById("appForm");
const errorBox = document.getElementById("errorBox");
const successBox = document.getElementById("successBox");
const viewBtn = document.getElementById("viewBtn");

const STORAGE_KEY = "clubSignUps";

form.addEventListener("submit", function(e){
  e.preventDefault();

  let valid = true;
  errorBox.style.display = "none";
  successBox.style.display = "none";

  document.querySelectorAll(".missing").forEach(el => el.classList.remove("missing"));

  const required = form.querySelectorAll("[required]");

  required.forEach(field => {
    let empty = false;

    if(field.type === "radio"){
      const group = form.querySelectorAll(`input[name="${field.name}"]`);
      empty = ![...group].some(r => r.checked);
      group.forEach(r => r.classList.toggle("missing", empty));
    } else {
      empty = !field.value || field.value.trim() === "";
      field.classList.toggle("missing", empty);
    }

    if(empty) valid = false;
  });

  if(!valid){
    errorBox.style.display = "block";
    return;
  }

  const ok = confirm("Are you sure you want to submit this application?");
  if(!ok) return;

  const fd = new FormData(form);
  const record = {
    studentId: fd.get("studentId"),
    fullName: fd.get("fullName"),
    birthday: fd.get("birthday"),
    email: fd.get("email"),
    mobile: fd.get("mobile"),
    gradeLevel: fd.get("gradeLevel"),
    roleType: fd.get("roleType"),
    club: fd.get("club"),
    reason: fd.get("reason"),
    createdAt: new Date().toISOString() 
  };

  let signUps = [];
  const raw = localStorage.getItem(STORAGE_KEY);

  if(raw){
    try{
      const parsed = JSON.parse(raw);
      signUps = Array.isArray(parsed) ? parsed : [];
    }catch(err){
      signUps = [];
    }
  }

  signUps.push(record);

  localStorage.setItem(STORAGE_KEY, JSON.stringify(signUps));

  successBox.textContent = `Saved successfully! Total sign-ups: ${signUps.length}`;
  successBox.style.display = "block";
  form.reset();
});

form.addEventListener("reset", function(){
  errorBox.style.display = "none";
  successBox.style.display = "none";
  setTimeout(() => {
    document.querySelectorAll(".missing").forEach(el => el.classList.remove("missing"));
  }, 0);
});

viewBtn.addEventListener("click", () => {
  window.location.href = "viewSignUps.html";
});
</script>

</body>
</html>
